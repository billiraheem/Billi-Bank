name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:

  deploy:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read    # required to checkout code

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.36.2' # default is latest stable
      id: install

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::575036456868:role/github-ci
        aws-region: eu-north-1
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Load secrets from AWS Secrets Manager
      run: aws secretsmanager get-secret-value --secret-id billi_bank --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.env


    - name: Build, tag, and push docker image to Amazon ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORY: billibank
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
        docker push -a $REGISTRY/$REPOSITORY

    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --name billi_bank --region eu-north-1

    - name: Deploy image to Amazon EKS
      run: |
        kubectl apply -f eks/deployment.yaml 
        kubectl apply -f eks/service.yaml 
        kubectl apply -f eks/issuer.yaml 
        kubectl apply -f eks/ingress.yaml 